<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Mission Control Alpha surface</title>
  <desc id="desc">Illustrative view of the current Mission Control Company Pulse page with Infrastructure and Protected apps sections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f8f5ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#26345a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>
  <rect x="46" y="38" width="1108" height="604" rx="26" fill="#fdfdff" stroke="#dfe5f8" stroke-width="2" filter="url(#shadow)"/>

  <g transform="translate(90 82)" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="0" y="0" fill="#68769a" font-size="17" font-weight="700" letter-spacing="1.4">MISSION CONTROL</text>
    <text x="0" y="55" fill="#17213b" font-size="48" font-weight="800">Company Pulse</text>
    <text x="0" y="88" fill="#7c89a8" font-size="15">Illustrative view of the current public Alpha surface</text>

    <g transform="translate(0 142)">
      <text x="0" y="0" fill="#1e2a46" font-size="26" font-weight="800">Infrastructure</text>
      <text x="0" y="30" fill="#7b88a7" font-size="16">Current storage readiness, verified by Pixel.</text>

      <rect x="0" y="58" width="1018" height="150" rx="22" fill="url(#card)" stroke="#dbe2f4" stroke-width="2"/>
      <circle cx="42" cy="104" r="10" fill="#43c59e"/>
      <text x="68" y="111" fill="#1e2a46" font-size="22" font-weight="750">Storage state</text>
      <rect x="818" y="84" width="150" height="38" rx="19" fill="#e6f8f2"/>
      <text x="893" y="109" text-anchor="middle" fill="#1d7a62" font-size="14" font-weight="800">HEALTHY PATH</text>
      <text x="42" y="156" fill="#64718f" font-size="16">Simulator → canonical device contract → backend projection → Mission Control</text>
      <text x="42" y="184" fill="#8b96af" font-size="14">Run npm run start:degraded to exercise the deterministic failure path.</text>
    </g>

    <g transform="translate(0 392)">
      <text x="0" y="0" fill="#1e2a46" font-size="26" font-weight="800">Protected apps</text>
      <text x="0" y="30" fill="#7b88a7" font-size="16">Current launch access, verified by Pixel.</text>

      <rect x="0" y="58" width="1018" height="136" rx="22" fill="url(#card)" stroke="#dbe2f4" stroke-width="2"/>
      <circle cx="42" cy="103" r="10" fill="#7c83ff"/>
      <text x="68" y="110" fill="#1e2a46" font-size="22" font-weight="750">Access Gate decision</text>
      <text x="42" y="151" fill="#64718f" font-size="16">Identity + DeviceTrust + deterministic Policy → bounded allow/deny result</text>
      <text x="42" y="177" fill="#8b96af" font-size="14">The browser presents the decision; it does not create trust or authority.</text>
    </g>
  </g>
</svg>
