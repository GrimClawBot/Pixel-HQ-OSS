<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pixel HQ</title>
  <desc id="desc">Secure infrastructure for AI organizations, showing Access Gate, Relay, Tool Gateway, and Evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#151b33"/>
      <stop offset="100%" stop-color="#24163a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#b58cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="170" fill="#8b5cf6" opacity="0.10"/>
  <circle cx="170" cy="360" r="210" fill="#3b82f6" opacity="0.08"/>

  <g transform="translate(70 64)">
    <text x="0" y="58" fill="#ffffff" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="68" font-weight="800" letter-spacing="3">PIXEL HQ</text>
    <text x="2" y="99" fill="#c9d2f0" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="500">Secure infrastructure for AI organizations</text>
    <text x="2" y="132" fill="#8fa1d4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">SIMULATOR-FIRST  •  CONTRACT-DRIVEN  •  AUDITABLE  •  VENDOR-NEUTRAL</text>
  </g>

  <g transform="translate(74 242)" filter="url(#shadow)">
    <g>
      <rect x="0" y="0" width="210" height="96" rx="18" fill="#141b31" stroke="#6378b8" stroke-width="1.5"/>
      <circle cx="30" cy="28" r="7" fill="#70a5ff"/>
      <text x="50" y="34" fill="#ffffff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">Access Gate</text>
      <text x="22" y="66" fill="#9fb0df" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Identity + DeviceTrust</text>
    </g>

    <path d="M220 48 H260" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M252 40 L262 48 L252 56" fill="none" stroke="#9b9eff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(270 0)">
      <rect x="0" y="0" width="190" height="96" rx="18" fill="#171a32" stroke="#7b70c4" stroke-width="1.5"/>
      <circle cx="30" cy="28" r="7" fill="#a78bfa"/>
      <text x="50" y="34" fill="#ffffff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">Pixel Relay</text>
      <text x="22" y="66" fill="#b2a9df" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Canonical job state</text>
    </g>

    <path d="M470 48 H510" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M502 40 L512 48 L502 56" fill="none" stroke="#9b9eff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(520 0)">
      <rect x="0" y="0" width="210" height="96" rx="18" fill="#171a32" stroke="#8c69d3" stroke-width="1.5"/>
      <circle cx="30" cy="28" r="7" fill="#c084fc"/>
      <text x="50" y="34" fill="#ffffff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">Tool Gateway</text>
      <text x="22" y="66" fill="#c2afe7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Execution-time capability</text>
    </g>

    <path d="M740 48 H780" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M772 40 L782 48 L772 56" fill="none" stroke="#9b9eff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(790 0)">
      <rect x="0" y="0" width="245" height="96" rx="18" fill="#11192d" stroke="#5779a8" stroke-width="1.5"/>
      <circle cx="30" cy="28" r="7" fill="#67e8f9"/>
      <text x="50" y="34" fill="#ffffff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">Structured Evidence</text>
      <text x="22" y="66" fill="#9ac6d1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Bounded • causal • reviewable</text>
    </g>
  </g>

  <text x="1126" y="390" text-anchor="end" fill="#7180aa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">ALPHA</text>
</svg>
