name: Pixel HQ CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pixel-hq-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    name: Pixel HQ validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript and JSON
        run: npm run check:source

      - name: Run full test suite
        run: npm test

      - name: Check PR whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
